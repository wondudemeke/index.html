<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Asset Store</title>
  <!-- Telegram Web App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Tailwind CSS CDN for styling -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* CSS variables provided dynamically by Telegram */
    body {
      background-color: var(--tg-theme-bg-color, #ffffff);
      color: var(--tg-theme-text-color, #000000);
    }
  </style>
</head>
<body class="p-4 font-sans min-h-screen pb-24">

  <!-- Header -->
  <header class="mb-6">
    <h1 class="text-2xl font-bold">Digital Store</h1>
    <p class="text-sm opacity-70">Books, Datasets & Design Assets</p>
  </header>

  <!-- Category Filter Buttons -->
  <div class="flex gap-2 mb-6 overflow-x-auto pb-2">
    <button onclick="filterCategory('all')" class="cat-btn px-4 py-1.5 rounded-full text-sm font-medium bg-blue-500 text-white">All</button>
    <button onclick="filterCategory('book')" class="cat-btn px-4 py-1.5 rounded-full text-sm font-medium bg-gray-200 dark:bg-gray-800 opacity-70">Books</button>
    <button onclick="filterCategory('data')" class="cat-btn px-4 py-1.5 rounded-full text-sm font-medium bg-gray-200 dark:bg-gray-800 opacity-70">Data</button>
    <button onclick="filterCategory('design')" class="cat-btn px-4 py-1.5 rounded-full text-sm font-medium bg-gray-200 dark:bg-gray-800 opacity-70">Design</button>
  </div>

  <!-- Product List Container -->
  <div id="product-grid" class="grid grid-cols-1 gap-4">
    <!-- Rendered dynamically by JavaScript -->
  </div>

  <!-- JavaScript Application Logic -->
  <script>
    // Initialize Telegram WebApp
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    // Product Catalog
    const products = [
      { id: 'p1', title: 'Developer Masterclass Book', type: 'book', price: '250 ⭐', desc: 'Complete PDF + EPUB guide for senior engineers.' },
      { id: 'p2', title: 'Global Tech Salary Dataset', type: 'data', price: '500 ⭐', desc: 'Clean CSV data with over 50,000 global salary records.' },
      { id: 'p3', title: 'SaaS UI/UX Design System', type: 'design', price: '300 ⭐', desc: 'Figma design kit with 100+ components & templates.' }
    ];

    let cart = [];

    // Render Products to HTML
    function renderProducts(category = 'all') {
      const container = document.getElementById('product-grid');
      container.innerHTML = '';

      const filtered = category === 'all' 
        ? products 
        : products.filter(p => p.type === category);

      filtered.forEach(p => {
        const item = document.createElement('div');
        item.className = "p-4 rounded-xl border border-gray-200 dark:border-gray-800 shadow-sm flex flex-col justify-between";
        item.innerHTML = `
          <div>
            <span class="text-xs uppercase tracking-wider px-2 py-0.5 rounded bg-blue-100 text-blue-800 font-semibold">${p.type}</span>
            <h2 class="text-lg font-semibold mt-2">${p.title}</h2>
            <p class="text-sm opacity-70 mt-1">${p.desc}</p>
          </div>
          <div class="flex items-center justify-between mt-4 pt-4 border-t border-gray-100 dark:border-gray-800">
            <span class="font-bold text-base">${p.price}</span>
            <button onclick="addToCart('${p.id}')" class="px-4 py-2 rounded-lg text-sm font-semibold bg-blue-500 text-white hover:bg-blue-600 active:scale-95 transition-all">
              Add to Order
            </button>
          </div>
        `;
        container.appendChild(item);
      });
    }

    // Category Filter Handler
    function filterCategory(cat) {
      renderProducts(cat);
    }

    // Add Item to Cart & Update Telegram MainButton
    function addToCart(id) {
      const product = products.find(p => p.id === id);
      cart.push(product);

      if (tg && tg.MainButton) {
        tg.MainButton.text = `Checkout (${cart.length} item${cart.length > 1 ? 's' : ''})`;
        tg.MainButton.show();
        tg.MainButton.onClick(sendDataToBot);
      }
    }

    // Send Selected Data Back to Telegram Bot
    function sendDataToBot() {
      if (tg) {
        const payload = JSON.stringify({ cart: cart });
        tg.sendData(payload); // Sends data back to bot event `web_app_data`
        tg.close();
      }
    }

    // Initial Render
    renderProducts();
  </script>
</body>
</html>
